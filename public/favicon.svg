<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ef4565"/>
      <stop offset="50%"  stop-color="#f5a524"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square with brand gradient -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#grad)"/>

  <!-- Gauge icon — white, centred at (16, 20), radius 10 -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer arc: half-circle open at the bottom -->
    <path d="M 6 20 A 10 10 0 0 1 26 20" stroke-width="2.2"/>
    <!-- Tick at top (12 o'clock) -->
    <line x1="16" y1="10" x2="16" y2="12.5" stroke-width="2"/>
    <!-- Tick at 9 o'clock (left) -->
    <line x1="6"  y1="20" x2="8.5" y2="20" stroke-width="2"/>
    <!-- Tick at 3 o'clock (right) -->
    <line x1="26" y1="20" x2="23.5" y2="20" stroke-width="2"/>
    <!-- Needle: pointing upper-left (~10 o'clock) -->
    <line x1="16" y1="20" x2="10" y2="13.5" stroke-width="2.2"/>
  </g>
  <!-- Centre pin -->
  <circle cx="16" cy="20" r="2" fill="white"/>
</svg>
